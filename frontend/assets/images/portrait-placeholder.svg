<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 650" role="img" aria-label="Portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEECE7"/>
      <stop offset="1" stop-color="#E6E3DC"/>
    </linearGradient>
    <radialGradient id="soft" cx="0.3" cy="0.05" r="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#171717" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="520" height="650" fill="url(#bg)"/>
